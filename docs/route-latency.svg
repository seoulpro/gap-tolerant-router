<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Route latency reference run</title>
  <desc id="desc">Median and ninety-fifth percentile route latency, in microseconds, for eight synthetic reference cases. Case 008 has the highest median at 52.3 microseconds. Case 001 has the highest ninety-fifth percentile at 99.3 microseconds.</desc>
  <style>
    .background { fill: #ffffff; }
    .heading { fill: #1f2328; font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #1f2328; font: 14px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .value { fill: #57606a; font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .muted { fill: #57606a; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .range { stroke: #fb8c00; stroke-width: 2; }
    .tail { stroke: #fb8c00; stroke-width: 2; }
    .median { fill: #0969da; stroke: #ffffff; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .heading, .label { fill: #f0f6fc; }
      .value, .muted { fill: #8c959f; }
      .grid { stroke: #3d444d; }
      .range, .tail { stroke: #ffa657; }
      .median { fill: #58a6ff; stroke: #0d1117; }
    }
  </style>

  <rect class="background" width="900" height="420" rx="6"/>
  <text class="heading" x="24" y="28">Route latency</text>
  <text class="muted" x="876" y="28" text-anchor="end">median dot · p95 tick · lower is faster</text>

  <g aria-hidden="true">
    <line class="grid" x1="130" y1="48" x2="130" y2="354"/>
    <line class="grid" x1="250" y1="48" x2="250" y2="354"/>
    <line class="grid" x1="370" y1="48" x2="370" y2="354"/>
    <line class="grid" x1="490" y1="48" x2="490" y2="354"/>
    <line class="grid" x1="610" y1="48" x2="610" y2="354"/>
    <line class="grid" x1="730" y1="48" x2="730" y2="354"/>

    <text class="label" x="112" y="75" text-anchor="end">case-001</text>
    <line class="range" x1="130" y1="70" x2="725.890" y2="70"/>
    <line class="tail" x1="725.890" y1="64" x2="725.890" y2="76"/>
    <circle class="median" cx="361.162" cy="70" r="5"/>
    <text class="value" x="756" y="75">38.5 / 99.3</text>

    <text class="label" x="112" y="113" text-anchor="end">case-002</text>
    <line class="range" x1="130" y1="108" x2="356.248" y2="108"/>
    <line class="tail" x1="356.248" y1="102" x2="356.248" y2="114"/>
    <circle class="median" cx="313.684" cy="108" r="5"/>
    <text class="value" x="756" y="113">30.6 / 37.7</text>

    <text class="label" x="112" y="151" text-anchor="end">case-003</text>
    <line class="range" x1="130" y1="146" x2="370.330" y2="146"/>
    <line class="tail" x1="370.330" y1="140" x2="370.330" y2="152"/>
    <circle class="median" cx="313.270" cy="146" r="5"/>
    <text class="value" x="756" y="151">30.5 / 40.1</text>

    <text class="label" x="112" y="189" text-anchor="end">case-004</text>
    <line class="range" x1="130" y1="184" x2="310.774" y2="184"/>
    <line class="tail" x1="310.774" y1="178" x2="310.774" y2="190"/>
    <circle class="median" cx="295.354" cy="184" r="5"/>
    <text class="value" x="756" y="189">27.6 / 30.1</text>

    <text class="label" x="112" y="227" text-anchor="end">case-005</text>
    <line class="range" x1="130" y1="222" x2="335.626" y2="222"/>
    <line class="tail" x1="335.626" y1="216" x2="335.626" y2="228"/>
    <circle class="median" cx="307.408" cy="222" r="5"/>
    <text class="value" x="756" y="227">29.6 / 34.3</text>

    <text class="label" x="112" y="265" text-anchor="end">case-006</text>
    <line class="range" x1="130" y1="260" x2="279.904" y2="260"/>
    <line class="tail" x1="279.904" y1="254" x2="279.904" y2="266"/>
    <circle class="median" cx="275.050" cy="260" r="5"/>
    <text class="value" x="756" y="265">24.2 / 25.0</text>

    <text class="label" x="112" y="303" text-anchor="end">case-007</text>
    <line class="range" x1="130" y1="298" x2="294.388" y2="298"/>
    <line class="tail" x1="294.388" y1="292" x2="294.388" y2="304"/>
    <circle class="median" cx="284.476" cy="298" r="5"/>
    <text class="value" x="756" y="303">25.7 / 27.4</text>

    <text class="label" x="112" y="341" text-anchor="end">case-008</text>
    <line class="range" x1="130" y1="336" x2="505.162" y2="336"/>
    <line class="tail" x1="505.162" y1="330" x2="505.162" y2="342"/>
    <circle class="median" cx="443.998" cy="336" r="5"/>
    <text class="value" x="756" y="341">52.3 / 62.5</text>

    <text class="muted" x="130" y="376" text-anchor="middle">0</text>
    <text class="muted" x="250" y="376" text-anchor="middle">20</text>
    <text class="muted" x="370" y="376" text-anchor="middle">40</text>
    <text class="muted" x="490" y="376" text-anchor="middle">60</text>
    <text class="muted" x="610" y="376" text-anchor="middle">80</text>
    <text class="muted" x="730" y="376" text-anchor="middle">100 µs</text>
  </g>

  <text class="muted" x="24" y="408">gap-tolerant-router 0.1.1 · Node.js 22.17.0 · arm64 · 10,000 measured operations per case</text>
</svg>
